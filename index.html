<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ゾンビ金剛 v0.8.3</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:920px;margin:auto;padding:12px;background:#111;color:#eee;line-height:1.45}section{border:1px solid #444;border-radius:14px;padding:12px;margin:10px 0;background:#191919}h1{font-size:23px;margin:8px 0}h2{font-size:17px}h3{font-size:14px}label{font-size:12px;color:#bbb}select,input,button{box-sizing:border-box;width:100%;padding:9px;margin:3px 0 7px;border-radius:9px;border:1px solid #555;background:#222;color:#eee}button{background:#345cff;border:0;font-weight:700;cursor:pointer}.sub{background:#2a2a2a;border:1px solid #555}.note{font-size:12px;color:#bbb}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.lv{display:grid;grid-template-columns:1fr 70px;gap:5px}.lvsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:-2px}.lvsteps button{padding:7px 4px;min-height:38px}.stat{padding:7px;border:1px solid #444;border-radius:8px;text-align:center}.ok{color:#71df8a}.bad{color:#ff7777}.warn{color:#f0c85a}details{border:1px solid #444;border-radius:9px;margin:6px 0;padding:8px}summary{font-weight:700;cursor:pointer}.ev{font-size:12px;border-top:1px solid #333;padding:5px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.m{border:1px solid #444;border-radius:8px;padding:8px;text-align:center}.m b{display:block;font-size:20px}.progress{height:8px;background:#252525;border-radius:99px;overflow:hidden;margin-top:8px}.progress>div{height:100%;width:0;background:#345cff}.pill{display:inline-block;padding:2px 7px;border:1px solid #555;border-radius:99px;font-size:11px;margin-right:4px}.checks label{display:inline-block;margin-right:12px}@media(max-width:650px){body{padding-top:calc(112px + env(safe-area-inset-top))}.g,.g5,.metrics{grid-template-columns:1fr 1fr}}
</style></head><body>
<h1>🧟 ゾンビ金剛シミュレーター</h1><div class="note">v0.8.3 — Lv操作ボタン / モバイル上部表示修正</div>
<section><h2>1. モンスター</h2>
<label>種族</label><select id="sp"><option value="fire0">🔥 火・幼生｜ポッカ</option><option value="fireA1">🔥 火A1｜エンバーゲッコ</option><option value="fireB1">🔥 火B1｜ファイアパピー</option><option value="fireA2">🔥 火A2｜フレアドラコ</option><option value="water0">💧 水・幼生｜シズク</option><option value="waterB1">💧 水B1｜ヒヨペン</option><option value="waterB2">💧 水B2｜ブリザードペンギン</option><option value="wind0">🌪️ 風・幼生｜ソヨカ</option><option value="windA1">🌪️ 風A1｜ウィンドウウィーゼル</option><option value="windB1" selected>🌪️ 風B1｜ゼファーキャット</option><option value="windA2">🌪️ 風A2｜ストームウィーゼル</option><option value="thunder0">⚡ 雷・幼生｜ピリカ</option><option value="thunderB1">⚡ 雷B1｜ボルトマウス</option><option value="thunderA2">⚡ 雷A2｜サンダーバード</option></select>
<div id="base" class="note"></div><div class="g"><div><label>通常 / レア</label><select id="rare"><option value="n">通常卵</option><option value="r">レア卵</option></select></div><div><label>Lv</label><div class="lv"><input id="lv" type="number" min="2" max="55" value="20"><button id="min" class="sub" type="button">MIN</button></div><div class="lvsteps"><button class="sub lvstep" data-step="-5" type="button">−5</button><button class="sub lvstep" data-step="-1" type="button">−1</button><button class="sub lvstep" data-step="1" type="button">＋1</button><button class="sub lvstep" data-step="5" type="button">＋5</button></div></div><div><label>ダンジョン属性</label><select id="da"><option value="無">⚪ 無</option><option value="火">🔥 火</option><option value="水">💧 水</option><option value="風">🌪️ 風</option><option value="雷">⚡ 雷</option><option value="光">✨ 光</option><option value="闇">🌑 闇</option></select></div></div>
<label>個体補正pt</label><input id="adj" type="number" value="0"><h2>振り分けpt</h2><div class="g5"><div><label>HP</label><input id="h" type="number" min="0" value="0"></div><div><label>攻撃</label><input id="a" type="number" min="0" value="0"></div><div><label>防御</label><input id="d" type="number" min="0" value="0"></div><div><label>特殊</label><input id="c" type="number" min="0" value="0"></div><div><label>素早さ</label><input id="s" type="number" min="0" value="0"></div></div><div id="pts" class="note"></div><div id="fs" class="g5"></div><div id="skill" class="note"></div></section>
<section><h2>2. 装備</h2><div class="g"><div><label>HP装備</label><select id="eh"></select></div><div><label>攻撃装備</label><select id="ea"></select></div><div><label>特殊装備</label><select id="ec"></select></div><div><label>素早さ装備</label><select id="es"></select></div></div><div class="checks"><label><input id="book" type="checkbox" style="width:auto"> 📘 学びの書</label><label><input id="dag" type="checkbox" style="width:auto"> 🗡️ 諸刃の短剣</label><label><input id="tal" type="checkbox" style="width:auto"> 🧿 生命の護符</label></div><p class="note">📘 学びの書を選択した場合は、他装備より最優先し「学びの書を装備する前提」で最小期待値ビルドを探索します。</p><p class="note">🗡️ 諸刃の短剣：与ダメージ+8 / 被ダメージ+8。クリティカルとの演算順は未確認のため、現在は <b>元ダメージ×1.5を四捨五入 → +8</b> で暫定計算しています。</p><p class="note">防御装備・身代わりのお守りは対象外。回避＋クリティカルは内部で確率計算します。</p><div class="g"><button id="opt">10F・平均回復薬 最小ビルド</button><button id="sim" class="sub">現在の配分を確認</button></div><div id="prog" class="progress" style="display:none"><div id="bar"></div></div><div id="ptxt" class="note"></div></section>
<section><h2>3. 結果</h2><div id="out" class="note">条件を入力して計算してください。</div></section>
<script>
'use strict';
const $=x=>document.getElementById(x),F=Math.floor,R=Math.round,CL=(x,a,b)=>Math.max(a,Math.min(b,x)),CRIT=.10;
const E=[[43,16,9,14,10],[53,18,13,16,12],[59,20,15,18,14],[92,34,25,31,24],[120,41,35,38,30],[140,49,42,45,36],[155,53,49,49,58],[170,58,54,54,70],[205,69,63,63,105],[345,107,93,107,140]];
const S={fire0:['ポッカ','火','0',[14,6,2,3,5]],fireA1:['エンバーゲッコ','火','1',[29,14,3,5,9]],fireB1:['ファイアパピー','火','1',[29,10,5,7,9]],fireA2:['フレアドラコ','火','2',[46,25,8,9,17]],water0:['シズク','水','0',[15,3,5,5,2]],waterB1:['ヒヨペン','水','1',[33,3,7,11,6]],waterB2:['ブリザードペンギン','水','2',[52,7,13,22,11]],wind0:['ソヨカ','風','0',[12,4,3,4,7]],windA1:['ウィンドウィーゼル','風','1',[25,9,4,7,15]],windB1:['ゼファーキャット','風','1',[26,8,7,9,10]],windA2:['ストームウィーゼル','風','2',[40,17,8,13,27]],thunder0:['ピリカ','雷','0',[13,3,3,6,5]],thunderB1:['ボルトマウス','雷','1',[28,11,6,7,8]],thunderA2:['サンダーバード','雷','2',[43,7,13,26,16]]};
const eqOpts=Array.from({length:23},(_,i)=>`<option value="${i}">${i}</option>`).join('');for(const id of['eh','ea','ec','es'])$(id).innerHTML=eqOpts;
function stageMin(z){return z==='0'?2:z==='1'?10:z==='2'?20:30}function pointsAt(lv){return Math.max(0,2*(lv-1)+($('rare').value==='r'?3:0)+(+$('adj').value||0))}function minlv(){let z=S[$('sp').value],sm=stageMin(z[2]);for(let lv=sm;lv<=55;lv++)if(z[3][2]+F(pointsAt(lv)*1.5)>=40)return lv;return 56}function tp(){return pointsAt(+$('lv').value)}function al(){return['h','a','d','c','s'].map(x=>Math.max(0,F(+$(x).value||0)))}
function mul(a,b){if(a==='無'||b==='無')return 1;if(a==='光')return b==='闇'?2/3:['火','水','風','雷'].includes(b)?1.2:1;if(b==='光')return a==='闇'?1.5:['火','水','風','雷'].includes(a)?.8:1;if(a==='闇')return ['光','水','火'].includes(b)?1.5:['風','雷'].includes(b)?2/3:1;if(b==='闇')return ['風','雷'].includes(a)?1.5:['火','水'].includes(a)?2/3:1;let w={水:'火',火:'風',風:'雷',雷:'水'};return w[a]===b?1.5:w[b]===a?2/3:1}
function nd(x,y){return Math.max(1,R(x[1]+x[2]*.5-F(F(y[2]*.4)*.5)))}function cd(x,y,aa,da){return Math.max(1,R(Math.max(1,x[3]-F(y[3]/2))*mul(aa,da)))}function hit(x,y,aa,da){let n=nd(x,y),c=cd(x,y,aa,da);return n>=c?['通常',n]:['特殊',c]}function dodge(defS,attS){return Math.min(.3,Math.max(0,defS-attS)/100)}function critDmg(base,dag){return R(base*1.5)+(dag?8:0)}function normDmg(base,dag){return base+(dag?8:0)}
function eqs(){if($('book').checked)return [['学びの書','book',0]];let r=[['なし','none',0]],m=[['HP','eh',0],['攻撃','ea',1],['特殊','ec',3],['素早さ','es',4]];for(let q of m){let v=+$(q[1]).value;if(v)r.push([q[0]+'+'+v,'stat',v,q[2]])}if($('dag').checked)r.push(['諸刃の短剣','dag',0]);if($('tal').checked)r.push(['生命の護符','tal',0]);return r}
function build(A,e){let z=S[$('sp').value],b=z[3],st=[b[0]+A[0]*4,b[1]+A[1],b[2]+F(A[2]*1.5),b[3]+A[3],b[4]+A[4]];if(e[1]==='stat')st[e[3]]+=e[3]===0?e[2]*4:e[2];return{name:z[0],attr:z[1],base:b,A:[...A],e,st,rawD:b[2]+F(A[2]*1.5)}}
function floorFixed(B,i,hp,log){let en=E[i].slice(),ehp=en[0],pots=0,k=false,tused=false,turn=B.st[4]>=en[4]?'p':'e',ev=[],dag=B.e[1]==='dag',tal=B.e[1]==='tal',aa=B.attr,da=$('da').value;if(log){let ph=hit(B.st,en,aa,da),eh=hit(en,B.st,da,aa);ev.push(`開始 自HP ${hp} / 敵HP ${ehp}${tal&&hp<=B.st[0]/2?'（護符はまだ発動しない）':''}`);ev.push(`命中時目安：自分 ${ph[0]} ${normDmg(ph[1],dag)} / CRIT ${critDmg(ph[1],dag)}｜敵 ${eh[0]} ${normDmg(eh[1],dag)} / CRIT ${critDmg(eh[1],dag)}`)}let th=()=>{if(tal&&!tused&&hp>0&&hp<=B.st[0]/2){let x=R(B.st[0]*.25),q=hp;hp=Math.min(B.st[0],hp+x);tused=true;if(log)ev.push(`🧿 護符 ${q}→${hp}（+${x}）`)}};while(ehp>0&&pots<60){if(turn==='p'){let q=hit(B.st,en,aa,da),x=normDmg(q[1],dag),v=ehp;ehp=Math.max(0,ehp-x);if(log)ev.push(`自分 ${q[0]} ${x}：敵 ${v}→${ehp}`);if(ehp<=0)break;turn='e'}else{let q=hit(en,B.st,da,aa),x=normDmg(q[1],dag),v=hp;if(!k){k=true;let rr=R(x*.5),take=R(x*.75),ee=ehp;ehp=Math.max(0,ehp-rr);if(log)ev.push(`金剛 被${take}/反射${rr}：敵 ${ee}→${ehp}`);if(ehp<=0)break;hp-=take;if(log)ev.push(`自HP ${v}→${Math.max(0,hp)}`);if(hp>0)th()}else{hp-=x;if(log)ev.push(`敵 ${q[0]} ${x}：自HP ${v}→${Math.max(0,hp)}`);if(hp>0)th()}if(hp<=0){pots++;hp=B.st[0];k=false;turn=B.st[4]>=en[4]?'p':'e';if(log)ev.push(`💊 復活${pots}：HP${hp} / 金剛再使用可`)}else turn='p'}}if(log)ev.push(`終了 ${ehp<=0?'勝利':'敗北'} / HP${hp} / 薬${pots}`);return{win:ehp<=0,hp,pots,ev}}
function runFixed(B,log=false){if(B.rawD<40)return null;let hp=B.st[0],p=0,fl=[];for(let i=0;i<10;i++){let r=floorFixed(B,i,hp,log);p+=r.pots;fl.push({...r,f:i+1,c:p});if(!r.win)return null;hp=r.hp}return{p,hp,fl}}
function runMC(B,N=80,seed0=123456789){if(B.rawD<40)return 1e9;let seed=seed0>>>0,rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296},sum=0,da=$('da').value,dag=B.e[1]==='dag',tal=B.e[1]==='tal';for(let n=0;n<N;n++){let hp=B.st[0],pots=0;for(let f=0;f<10;f++){let en=E[f],ehp=en[0],k=false,tu=false,turn=B.st[4]>=en[4]?'p':'e',guard=0;while(ehp>0&&guard++<500){if(turn==='p'){if(rnd()>=dodge(en[4],B.st[4])){let base=hit(B.st,en,B.attr,da)[1],x=rnd()<CRIT?critDmg(base,dag):normDmg(base,dag);ehp=Math.max(0,ehp-x);if(ehp<=0)break}turn='e'}else{if(rnd()<dodge(B.st[4],en[4])){turn='p';continue}let base=hit(en,B.st,da,B.attr)[1],x=rnd()<CRIT?critDmg(base,dag):normDmg(base,dag);if(!k){k=true;let rr=R(x*.5),take=R(x*.75);ehp=Math.max(0,ehp-rr);if(ehp<=0)break;hp-=take}else hp-=x;if(hp>0&&tal&&!tu&&hp<=B.st[0]/2){hp=Math.min(B.st[0],hp+R(B.st[0]*.25));tu=true}if(hp<=0){pots++;hp=B.st[0];k=false;turn=B.st[4]>=en[4]?'p':'e'}else turn='p'}}}sum+=pots}return sum/N}
function runExpected(B){if(B.rawD<40)return null;const eps=1e-11,maxHp=B.st[0],fp=Array(10).fill(0),fx=Array(10).fill(0),fh=Array(10).fill(0),dag=B.e[1]==='dag',tal=B.e[1]==='tal',da=$('da').value;let expected=0,clear=0,finalHp=0,cur=new Map(),steps=0;const tf=f=>B.st[4]>=E[f][4]?'p':'e',key=(f,h,eh,k,t,tr)=>`${f}|${h}|${eh}|${k?1:0}|${t?1:0}|${tr}`,add=(M,f,h,eh,k,t,tr,p)=>{if(p<eps)return;let K=key(f,h,eh,k,t,tr);M.set(K,(M.get(K)||0)+p)};add(cur,0,maxHp,E[0][0],false,false,tf(0),1);while(cur.size&&steps++<3500){let next=new Map();for(const[K,p]of cur){let q=K.split('|'),f=+q[0],h=+q[1],eh=+q[2],k=q[3]==='1',tu=q[4]==='1',tr=q[5],en=E[f];const exit=(pb,hh)=>{fx[f]+=pb;fh[f]+=pb*hh;if(f===9){clear+=pb;finalHp+=pb*hh}else add(next,f+1,hh,E[f+1][0],false,false,tf(f+1),pb)};if(tr==='p'){let dm=dodge(en[4],B.st[4]),pm=p*dm,hitP=p*(1-dm);if(pm)add(next,f,h,eh,k,tu,'e',pm);if(hitP){let base=hit(B.st,en,B.attr,da)[1];for(const[pc,crit]of[[hitP*(1-CRIT),false],[hitP*CRIT,true]]){if(pc<eps)continue;let x=crit?critDmg(base,dag):normDmg(base,dag),ne=Math.max(0,eh-x);if(ne<=0)exit(pc,h);else add(next,f,h,ne,k,tu,'e',pc)}}}else{let dm=dodge(B.st[4],en[4]),pm=p*dm,hitP=p*(1-dm);if(pm)add(next,f,h,eh,k,tu,'p',pm);if(hitP){let base=hit(en,B.st,da,B.attr)[1];for(const[pc,crit]of[[hitP*(1-CRIT),false],[hitP*CRIT,true]]){if(pc<eps)continue;let x=crit?critDmg(base,dag):normDmg(base,dag),nh=h,ne=eh,nk=k,nt=tu;if(!k){nk=true;let rr=R(x*.5),take=R(x*.75);ne=Math.max(0,eh-rr);if(ne<=0){exit(pc,h);continue}nh=h-take}else nh=h-x;if(nh>0&&tal&&!nt&&nh<=maxHp/2){nh=Math.min(maxHp,nh+R(maxHp*.25));nt=true}if(nh<=0){expected+=pc;fp[f]+=pc;add(next,f,maxHp,ne,false,nt,tf(f),pc)}else add(next,f,nh,ne,nk,nt,'p',pc)}}}}cur=next}return{p:expected,hp:clear?finalHp/clear:0,clear,fp,fh:fh.map((x,i)=>fx[i]?x/fx[i]:0),fx}}
function exp(B){let base=B.e[1]==='book'?75:65,L=+$('lv').value,m=L<=20?2:L<=30?1.5:L<=40?1.2:1;return[base,m,R(base*m)]}
function betterE(x,y){if(!y)return true;if(Math.abs(x.r.p-y.r.p)>1e-6)return x.r.p<y.r.p;if(Math.abs(x.r.hp-y.r.hp)>1e-6)return x.r.hp>y.r.hp;let ex=exp(x.B)[2],ey=exp(y.B)[2];if(ex!==ey)return ex>ey;return x.B.A[2]<y.B.A[2]}
function dodgeLabel(ps,es){let enemy=Math.round(dodge(es,ps)*100),self=Math.round(dodge(ps,es)*100);return enemy?`敵回避${enemy}%`:self?`自回避${self}%`:'回避なし'}
function show(B,r,n='結果'){let e=exp(B),base=runFixed(B,true),rows=r.fp.map((v,i)=>`<tr><td>${i+1}F</td><td>${(v||0).toFixed(3)}</td><td>${(r.fh[i]||0).toFixed(1)}</td><td>${dodgeLabel(B.st[4],E[i][4])}</td></tr>`).join(''),logs=base.fl.map((x,i)=>`<details><summary>${x.f}F｜${dodgeLabel(B.st[4],E[i][4])}｜平均薬${(r.fp[i]||0).toFixed(3)}</summary><div class="note">期待値計算は回避＋クリティカル分岐込み。以下は回避なし・クリティカルなしの基準進行で、冒頭に命中時の通常/CRITダメージを表示。</div>${x.ev.map(v=>`<div class="ev">${v}</div>`).join('')}</details>`).join('');$('out').innerHTML=`<h2>${n}</h2><div class="metrics"><div class="m">10F<b class="ok">CLEAR</b></div><div class="m">平均回復薬<b>${r.p.toFixed(3)}</b></div><div class="m">総EXP<b>${e[2]}</b><span class="note">${e[0]}×${e[1]}</span></div><div class="m">装備<b style="font-size:13px">${B.e[0]}</b></div></div><p>配分 H${B.A[0]} A${B.A[1]} D${B.A[2]} C${B.A[3]} S${B.A[4]}</p><div class="g5">${['HP','攻','防','特','速'].map((v,i)=>`<div class="stat">${v}<br><b>${B.st[i]}</b></div>`).join('')}</div><h3>各階の期待値</h3><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><tr><th>階</th><th>平均薬</th><th>平均終了HP</th><th>回避</th></tr>${rows}</table></div><h2>各階バトルログ</h2>${logs}<p class="note">※最適化は回避＋クリティカル込みの平均回復薬数（期待値）を最小化。回避率は素早さ差1につき1%、上限30%。片方に回避率がある場合、もう片方は必ず0%なので非0側だけ表示します。クリティカル率は双方10%、命中時ダメージ×1.5として内部計算しますが、各階の期待値・ログ見出しには表示しません。敵クリティカルで増えた被ダメージは金剛の軽減・反射にも反映。回避時は被弾扱いではないため金剛・生命の護符は消費しません。諸刃の短剣の+8は暫定でクリティカル倍率計算後に加算します。</p>`}
function preview(){let z=S[$('sp').value],A=al(),T=tp(),u=A.reduce((x,y)=>x+y,0),B=build(A,['なし','none',0]),m=minlv();$('lv').min=Math.min(m,55);$('base').textContent=`${z[0]} 基礎：HP${z[3][0]} / 攻${z[3][1]} / 防${z[3][2]} / 特${z[3][3]} / 速${z[3][4]}`;$('pts').innerHTML=m<=55?`MIN Lv <b>${m}</b>（進化条件＋金剛到達可能Lv） / 利用${T}pt / 使用${u}pt / 残り <b>${T-u}</b>`:`<span class="bad">Lv55までに金剛取得不可</span>`;$('fs').innerHTML=B.st.map((v,i)=>`<div class="stat">${['HP','攻','防','特','速'][i]}<br><b>${v}</b></div>`).join('');$('skill').innerHTML=B.rawD>=40?`<span class="ok">金剛習得（防御${B.rawD}）</span>`:`金剛まで防御 ${40-B.rawD}`}
function manual(){let m=minlv();if(+$('lv').value<m)return $('out').textContent=`MIN Lv${m}未満です`;let A=al();if(A.reduce((x,y)=>x+y,0)>tp())return $('out').textContent='pt超過です';let best=null;for(let e of eqs()){let B=build(A,e),r=runExpected(B),cand={B,r};if(r&&betterE(cand,best))best=cand}if(best)show(best.B,best.r,'現在の配分');else $('out').textContent='金剛未習得または計算不可'}
function candidateAllocs(T){let z=S[$('sp').value],need=Math.max(0,Math.ceil((40-z[3][2])/1.5)),set=new Set(),out=[],add=A=>{if(A.some(x=>x<0)||A.reduce((x,y)=>x+y,0)!==T)return;let k=A.join(',');if(!set.has(k)){set.add(k);out.push(A)}};let H=new Set([0,2,4,6,8,10,12,16,20,24,30,40,F(T/2),T].filter(x=>x>=0&&x<=T)),D=new Set([need,need+1,need+2,need+4,need+8,need+12,F((need+T)/2),T].filter(x=>x>=0&&x<=T)),speeds=new Set([0,T]);for(let x=0;x<=T;x+=10)speeds.add(x);for(const en of E){let n=en[4]-z[3][4];for(const v of[n-1,n,n+1])if(v>=0&&v<=T)speeds.add(v)}for(const h of H)for(const d of D)for(const s of speeds){let rem=T-h-d-s;if(rem<0)continue;let marks=new Set([0,rem,F(rem/2),CL(30-z[3][1],0,rem),CL(rem-(30-z[3][3]),0,rem)]);for(const a of marks)add([h,a,d,rem-a,s])}let seed=(T+1)*2654435761>>>0,rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};for(let i=0;i<900;i++){let cuts=[rnd(),rnd(),rnd(),rnd()].sort((a,b)=>a-b).map(x=>F(x*(T+1)));add([cuts[0],cuts[1]-cuts[0],cuts[2]-cuts[1],cuts[3]-cuts[2],T-cuts[3]])}return out.filter(A=>z[3][2]+F(A[2]*1.5)>=40)}
async function optimize(){let m=minlv();if(m>55)return $('out').textContent='Lv55までに金剛を取得できません';if(+$('lv').value<m)$('lv').value=m;preview();let T=tp(),As=candidateAllocs(T),Es=eqs(),rough=[],rank=[],count=0;$('opt').disabled=$('sim').disabled=true;$('prog').style.display='block';for(let i=0;i<As.length;i++)for(let j=0;j<Es.length;j++){let B=build(As[i],Es[j]),rf=runFixed(B,false);if(rf){let ed=0,sd=0;for(let f=0;f<10;f++){ed+=dodge(E[f][4],B.st[4]);sd+=dodge(B.st[4],E[f][4])}rough.push({B,proxy:rf.p+1.4*ed-.9*sd})}}rough.sort((x,y)=>x.proxy-y.proxy);let pool=rough.slice(0,Math.min(2600,rough.length)),mcN=pool.length>1800?45:70;for(let i=0;i<pool.length;i++){let B=pool[i].B,score=runMC(B,mcN,(i+1)*1009);rank.push({B,score});count++;if(i%80===0){$('bar').style.width=`${Math.round(i/Math.max(1,pool.length)*70)}%`;$('ptxt').textContent=`一次探索 ${count.toLocaleString()}/${pool.length.toLocaleString()}候補`;await new Promise(r=>setTimeout(r,0))}}rank.sort((x,y)=>x.score-y.score);let uniq=[],seen=new Set();for(const x of rank){let k=x.B.A.join(',')+'|'+x.B.e[0];if(!seen.has(k)){seen.add(k);uniq.push(x)}if(uniq.length>=32)break}let best=null;for(let i=0;i<uniq.length;i++){let r=runExpected(uniq[i].B),cand={B:uniq[i].B,r};if(r&&betterE(cand,best))best=cand;$('bar').style.width=`${70+Math.round((i+1)/uniq.length*30)}%`;$('ptxt').textContent=`期待値精密化 ${i+1}/${uniq.length}`;await new Promise(r=>setTimeout(r,0))}if(best){show(best.B,best.r,'推奨ビルド');['h','a','d','c','s'].forEach((x,i)=>$(x).value=best.B.A[i]);preview()}else $('out').textContent='候補が見つかりません';$('opt').disabled=$('sim').disabled=false;$('prog').style.display='none';$('ptxt').textContent=`探索完了：${count.toLocaleString()}候補 → 上位${uniq.length}候補を精密計算`}
document.querySelectorAll('input,select').forEach(x=>x.onchange=preview);$('min').onclick=()=>{let m=minlv();if(m<=55)$('lv').value=m;preview()};document.querySelectorAll('.lvstep').forEach(btn=>btn.onclick=()=>{const min=Math.min(55,minlv()),cur=Math.max(min,Math.min(55,Math.floor(+$('lv').value||min)));$('lv').value=Math.max(min,Math.min(55,cur+(+btn.dataset.step||0)));preview()});$('sim').onclick=manual;$('opt').onclick=optimize;preview();
</script></body></html>
